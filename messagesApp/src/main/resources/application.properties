spring.application.name=messagesApp

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/messagesDB
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.secret=your-very-secure-secret-key-minimum-256-bits-long-for-hs256-algorithm-change-this-in-production
jwt.expiration=86400000

# Logging Configuration
logging.level.com.ochrona.messagesApp=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.show-spring-data-rest=false

# Server Configuration
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always
