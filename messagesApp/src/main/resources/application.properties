spring.application.name=messagesApp

# PostgreSQL Database Configuration
# Lokalne: localhost:5432, Docker: postgres:5432 (przez env variable)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/messagesDB}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
app.jwt.secret=${JWT_SECRET:your-very-secure-secret-key-minimum-256-bits-long-for-hs256-algorithm-change-this-in-production}
app.jwt.expiration=86400000

# Logging Configuration
logging.level.com.ochrona.messagesApp=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.show-spring-data-rest=false

# Server Configuration
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# Włącz obsługę proxy
server.forward-headers-strategy=native

# Konfiguracja zaufanych proxy
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto
server.tomcat.remoteip.internal-proxies=172\\.17\\..*|10\\..*|192\\.168\\..*|127\\.0\\.0\\.1